appId: com.feedwell.app
productName: Feedwell
directories:
  buildResources: resources
  output: dist
mac:
  category: public.app-category.news
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  minimumSystemVersion: '11.0'
extraResources:
  - from: node_modules/better-sqlite3/prebuilds/${arch}
    to: prebuilds/${arch}
    filter:
      - "**/*"
